    <text x="710.0" y="264" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#334155" text-anchor="middle">Validate Certification and</text>
    <text x="710.0" y="278" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#334155" text-anchor="middle">Compare Authority</text>
  </g>
  <g>
    <text x="570.0" y="306" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Confirm Subsystem Control</text>
    <rect x="485.0" y="311" width="170" height="18" rx="9" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1" />
    <text x="570.0" y="324" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#075985" text-anchor="middle">(Accepted, Session Uuid)</text>
    <line x1="705.0" y1="336" x2="437.0" y2="336" stroke="#d97706" stroke-width="2.2" marker-end="url(#arrow-broadcast)" />
    <circle cx="705.0" cy="336" r="3.5" fill="#d97706" />
  </g>
  <g>
    <rect x="653.5" y="366" width="113" height="20" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="1.2" />
    <text x="710.0" y="380" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#166534" text-anchor="middle">UNDER CONTROL</text>
  </g>
  <g>
    <text x="290.0" y="456" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Request Handover</text>
    <rect x="177.0" y="461" width="226" height="18" rx="9" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1" />
    <text x="290.0" y="474" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#075985" text-anchor="middle">(Authority, Certificate, Profile)</text>
    <line x1="155.0" y1="486" x2="703.0" y2="486" stroke="#1e3a8a" stroke-width="2.2" marker-end="url(#arrow-primary)" />
    <circle cx="155.0" cy="486" r="3.5" fill="#1e3a8a" />
  </g>
  <g>
    <rect x="580.0" y="514" width="260" height="42" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" />
    <text x="710.0" y="530" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#334155" text-anchor="middle">Validate Certification and</text>
    <text x="710.0" y="544" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#334155" text-anchor="middle">Compare Authority &gt; Default Authority</text>
  </g>
  <g>
    <text x="570.0" y="578" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Request Release</text>
    <line x1="705.0" y1="588" x2="437.0" y2="588" stroke="#d97706" stroke-width="2.2" marker-end="url(#arrow-broadcast)" />
    <circle cx="705.0" cy="588" r="3.5" fill="#d97706" />
  </g>
  <g>
    <text x="570.0" y="620" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Release Subsystem Control</text>
    <rect x="516.0" y="625" width="108" height="18" rx="9" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1" />
    <text x="570.0" y="638" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#075985" text-anchor="middle">(Session Uuid)</text>
    <line x1="435.0" y1="650" x2="703.0" y2="650" stroke="#1e3a8a" stroke-width="2.2" marker-end="url(#arrow-primary)" />
    <circle cx="435.0" cy="650" r="3.5" fill="#1e3a8a" />
  </g>
  <g>
    <text x="570.0" y="682" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Reject Subsystem Control</text>
    <rect x="516.0" y="687" width="108" height="18" rx="9" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1" />
    <text x="570.0" y="700" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#075985" text-anchor="middle">(Session Uuid)</text>
    <line x1="705.0" y1="712" x2="437.0" y2="712" stroke="#d97706" stroke-width="2.2" marker-end="url(#arrow-broadcast)" />
    <circle cx="705.0" cy="712" r="3.5" fill="#d97706" />
  </g>
  <g>
    <rect x="650.0" y="742" width="120" height="20" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2" />
    <text x="710.0" y="756" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#334155" text-anchor="middle">NOT CONTROLLED</text>
  </g>
  <g>
    <text x="290.0" y="778" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Request Subsystem Control</text>
    <rect x="205.0" y="783" width="170" height="18" rx="9" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1" />
    <text x="290.0" y="796" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#075985" text-anchor="middle">(Authority, Certificate)</text>
    <line x1="155.0" y1="808" x2="703.0" y2="808" stroke="#1e3a8a" stroke-width="2.2" marker-end="url(#arrow-primary)" />
    <circle cx="155.0" cy="808" r="3.5" fill="#1e3a8a" />
  </g>
  <g>
    <text x="570.0" y="840" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Confirm Subsystem Control</text>
    <rect x="516.0" y="845" width="108" height="18" rx="9" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1" />
    <text x="570.0" y="858" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#075985" text-anchor="middle">(Session Uuid)</text>
    <line x1="705.0" y1="870" x2="157.0" y2="870" stroke="#d97706" stroke-width="2.2" marker-end="url(#arrow-broadcast)" />
    <circle cx="705.0" cy="870" r="3.5" fill="#d97706" />
  </g>
  <g>
    <rect x="653.5" y="900" width="113" height="20" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="1.2" />
    <text x="710.0" y="914" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#166534" text-anchor="middle">UNDER CONTROL</text>
  </g>
</svg>
