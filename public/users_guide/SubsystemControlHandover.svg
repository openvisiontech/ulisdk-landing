    <text x="570.0" y="208" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#075985" text-anchor="middle">(Authority, Certificate)</text>
    <line x1="435.0" y1="220" x2="703.0" y2="220" stroke="#1e3a8a" stroke-width="2.2" marker-end="url(#arrow-primary)" />
    <circle cx="435.0" cy="220" r="3.5" fill="#1e3a8a" />
  </g>
  <g>
