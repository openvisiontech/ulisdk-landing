<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg version="1.1" viewBox="0 0 860 388" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients for OVT signature orange frame and light-blue inner panel -->
    <linearGradient id="orange-frame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb03a" />
      <stop offset="50%" stop-color="#ff9900" />
      <stop offset="100%" stop-color="#e08200" />
    </linearGradient>

    <linearGradient id="blue-panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eaf3fb" />
      <stop offset="100%" stop-color="#cfe2f3" />
    </linearGradient>

    <linearGradient id="bg-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Arrowhead markers -->
    <marker id="arrow-primary" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0.5 L 9.5 4 L 0 7.5 L 1.8 4 Z" fill="#1e3a8a" />
    </marker>

    <marker id="arrow-broadcast" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0.5 L 9.5 4 L 0 7.5 L 1.8 4 Z" fill="#d97706" />
    </marker>
  </defs>
  <!-- Main Diagram Container Card -->
  <rect x="10" y="10" width="840" height="368" rx="14" fill="url(#bg-card)" stroke="#cbd5e1" stroke-width="1.5" />
  <!-- Subtle Phase Background Bands -->
  <rect x="28" y="114" width="804" height="228" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1" />
  <!-- Lifelines -->
  <g stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,5">
    <line x1="150.0" y1="94" x2="150.0" y2="360" />
    <line x1="430.0" y1="94" x2="430.0" y2="360" />
    <line x1="710.0" y1="94" x2="710.0" y2="360" />
  </g>
  <!-- Phase Header Badges -->
  <g>
    <rect x="38" y="122" width="330" height="20" rx="5" fill="#e2e8f0" />
    <text x="48" y="136" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#475569" letter-spacing="0.5">PHASE 1: SUBSYSTEM ACCESS REQUEST &amp; BROADCAST</text>
  </g>
  <!-- Lifeline Bottom End Caps -->
  <g fill="#64748b">
    <rect x="134.0" y="358" width="32" height="5" rx="2.5" />
    <rect x="414.0" y="358" width="32" height="5" rx="2.5" />
    <rect x="694.0" y="358" width="32" height="5" rx="2.5" />
  </g>
  <!-- Activation Bars on Lifelines -->
  <rect x="145.0" y="176" width="10" height="82" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2" />
  <rect x="425.0" y="176" width="10" height="144" rx="3" fill="#ffedd5" stroke="#f59e0b" stroke-width="1.2" />
  <rect x="705.0" y="300" width="10" height="20" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2" />
  <!-- Actor Header Boxes -->
  <g>
    <rect x="67.0" y="33" width="170" height="64" rx="9" fill="#0f172a" fill-opacity="0.12" />
    <rect x="65.0" y="30" width="170" height="64" rx="9" fill="url(#orange-frame)" stroke="#b45309" stroke-width="1.2" />
    <rect x="73.0" y="37" width="154" height="50" rx="5" fill="url(#blue-panel)" stroke="#475569" stroke-width="1" />
    <text x="150.0" y="58" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a" text-anchor="middle">OCU (Subsystem</text>
    <text x="150.0" y="75" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Access Client)</text>
  </g>
  <g>
    <rect x="347.0" y="33" width="170" height="64" rx="9" fill="#0f172a" fill-opacity="0.12" />
    <rect x="345.0" y="30" width="170" height="64" rx="9" fill="url(#orange-frame)" stroke="#b45309" stroke-width="1.2" />
    <rect x="353.0" y="37" width="154" height="50" rx="5" fill="url(#blue-panel)" stroke="#475569" stroke-width="1" />
    <text x="430.0" y="58" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Subsystem</text>
    <text x="430.0" y="75" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Access</text>
  </g>
  <g>
    <rect x="627.0" y="33" width="170" height="64" rx="9" fill="#0f172a" fill-opacity="0.12" />
    <rect x="625.0" y="30" width="170" height="64" rx="9" fill="url(#orange-frame)" stroke="#b45309" stroke-width="1.2" />
    <rect x="633.0" y="37" width="154" height="50" rx="5" fill="url(#blue-panel)" stroke="#475569" stroke-width="1" />
    <text x="710.0" y="67" font-family="Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Comp Access</text>
  </g>
  <!-- Sequence Elements -->
  <g>
    <text x="290.0" y="156" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Request Subsystem Access</text>
    <rect x="236.0" y="161" width="108" height="18" rx="9" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1" />
    <text x="290.0" y="174" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#075985" text-anchor="middle">(Certificate)</text>
    <line x1="155.0" y1="186" x2="423.0" y2="186" stroke="#1e3a8a" stroke-width="2.2" marker-end="url(#arrow-primary)" />
    <circle cx="155.0" cy="186" r="3.5" fill="#1e3a8a" />
  </g>
  <g>
    <text x="290.0" y="218" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Confirm Subsystem Access</text>
    <rect x="164.5" y="223" width="251" height="18" rx="9" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1" />
    <text x="290.0" y="236" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#075985" text-anchor="middle">(Session Uuid, App/Data Access Right)</text>
    <line x1="425.0" y1="248" x2="157.0" y2="248" stroke="#d97706" stroke-width="2.2" marker-end="url(#arrow-broadcast)" />
    <circle cx="425.0" cy="248" r="3.5" fill="#d97706" />
  </g>
  <g>
    <text x="570.0" y="280" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Subsystem Broadcast: Set Access</text>
    <rect x="506.5" y="285" width="127" height="18" rx="9" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" />
    <text x="570.0" y="298" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#92400e" text-anchor="middle">(Access Rec List)</text>
    <line x1="435.0" y1="310" x2="703.0" y2="310" stroke="#d97706" stroke-width="2.2" marker-end="url(#arrow-broadcast)" />
    <circle cx="435.0" cy="310" r="3.5" fill="#d97706" />
  </g>
</svg>
