<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg version="1.1" viewBox="0 0 860 812" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients for OVT signature orange frame and light-blue inner panel -->
    <linearGradient id="orange-frame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb03a" />
      <stop offset="50%" stop-color="#ff9900" />
      <stop offset="100%" stop-color="#e08200" />
    </linearGradient>

    <linearGradient id="blue-panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eaf3fb" />
      <stop offset="100%" stop-color="#cfe2f3" />
    </linearGradient>

    <linearGradient id="bg-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Arrowhead markers -->
    <marker id="arrow-primary" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0.5 L 9.5 4 L 0 7.5 L 1.8 4 Z" fill="#1e3a8a" />
    </marker>

    <marker id="arrow-broadcast" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0.5 L 9.5 4 L 0 7.5 L 1.8 4 Z" fill="#d97706" />
    </marker>
  </defs>
  <!-- Main Diagram Container Card -->
  <rect x="10" y="10" width="840" height="792" rx="14" fill="url(#bg-card)" stroke="#cbd5e1" stroke-width="1.5" />
  <!-- Subtle Phase Background Bands -->
  <rect x="28" y="114" width="804" height="262" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1" />
  <rect x="28" y="388" width="804" height="378" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1" />
  <!-- Lifelines -->
  <g stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,5">
    <line x1="150.0" y1="94" x2="150.0" y2="784" />
    <line x1="430.0" y1="94" x2="430.0" y2="784" />
    <line x1="710.0" y1="94" x2="710.0" y2="784" />
  </g>
  <!-- Phase Header Badges -->
  <g>
    <rect x="38" y="122" width="268" height="20" rx="5" fill="#e2e8f0" />
    <text x="48" y="136" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#475569" letter-spacing="0.5">PHASE 1: AGENT REQUEST &amp; RESERVATION</text>
    <rect x="38" y="396" width="323" height="20" rx="5" fill="#e2e8f0" />
    <text x="48" y="410" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#475569" letter-spacing="0.5">PHASE 2: AGENT EXECUTION &amp; STATUS MONITORING</text>
  </g>
  <!-- Lifeline Bottom End Caps -->
  <g fill="#64748b">
    <rect x="134.0" y="782" width="32" height="5" rx="2.5" />
    <rect x="414.0" y="782" width="32" height="5" rx="2.5" />
    <rect x="694.0" y="782" width="32" height="5" rx="2.5" />
  </g>
  <!-- Activation Bars on Lifelines -->
  <rect x="145.0" y="162" width="10" height="82" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2" />
  <rect x="425.0" y="162" width="10" height="192" rx="3" fill="#ffedd5" stroke="#f59e0b" stroke-width="1.2" />
  <rect x="705.0" y="286" width="10" height="68" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2" />
  <rect x="145.0" y="436" width="10" height="116" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2" />
  <rect x="425.0" y="436" width="10" height="308" rx="3" fill="#ffedd5" stroke="#f59e0b" stroke-width="1.2" />
  <rect x="705.0" y="580" width="10" height="164" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2" />
  <!-- Actor Header Boxes -->
  <g>
    <rect x="67.0" y="33" width="170" height="64" rx="9" fill="#0f172a" fill-opacity="0.12" />
    <rect x="65.0" y="30" width="170" height="64" rx="9" fill="url(#orange-frame)" stroke="#b45309" stroke-width="1.2" />
    <rect x="73.0" y="37" width="154" height="50" rx="5" fill="url(#blue-panel)" stroke="#475569" stroke-width="1" />
    <text x="150.0" y="67" font-family="Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#0f172a" text-anchor="middle">OCU</text>
  </g>
  <g>
    <rect x="347.0" y="33" width="170" height="64" rx="9" fill="#0f172a" fill-opacity="0.12" />
    <rect x="345.0" y="30" width="170" height="64" rx="9" fill="url(#orange-frame)" stroke="#b45309" stroke-width="1.2" />
    <rect x="353.0" y="37" width="154" height="50" rx="5" fill="url(#blue-panel)" stroke="#475569" stroke-width="1" />
    <text x="430.0" y="58" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a" text-anchor="middle">OCU (Agent</text>
    <text x="430.0" y="75" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Client)</text>
  </g>
  <g>
    <rect x="627.0" y="33" width="170" height="64" rx="9" fill="#0f172a" fill-opacity="0.12" />
    <rect x="625.0" y="30" width="170" height="64" rx="9" fill="url(#orange-frame)" stroke="#b45309" stroke-width="1.2" />
    <rect x="633.0" y="37" width="154" height="50" rx="5" fill="url(#blue-panel)" stroke="#475569" stroke-width="1" />
    <text x="710.0" y="67" font-family="Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Agent</text>
  </g>
  <!-- Sequence Elements -->
  <g>
    <text x="290.0" y="162" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Set Agent Request Specs</text>
    <line x1="155.0" y1="172" x2="423.0" y2="172" stroke="#1e3a8a" stroke-width="2.2" marker-end="url(#arrow-primary)" />
    <circle cx="155.0" cy="172" r="3.5" fill="#1e3a8a" />
  </g>
  <g>
    <text x="290.0" y="204" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Set Agent Running Command</text>
    <rect x="236.0" y="209" width="108" height="18" rx="9" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1" />
    <text x="290.0" y="222" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#075985" text-anchor="middle">(RUN)</text>
    <line x1="155.0" y1="234" x2="423.0" y2="234" stroke="#1e3a8a" stroke-width="2.2" marker-end="url(#arrow-primary)" />
    <circle cx="155.0" cy="234" r="3.5" fill="#1e3a8a" />
  </g>
  <g>
    <text x="570.0" y="266" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Request Agent</text>
    <rect x="407.5" y="271" width="325" height="18" rx="9" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1" />
    <text x="570.0" y="284" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#075985" text-anchor="middle">(Request Uuid, Configuration, Completion Timeout)</text>
    <line x1="435.0" y1="296" x2="703.0" y2="296" stroke="#1e3a8a" stroke-width="2.2" marker-end="url(#arrow-primary)" />
    <circle cx="435.0" cy="296" r="3.5" fill="#1e3a8a" />
  </g>
  <g>
    <text x="570.0" y="334" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Confirm Agent</text>
    <line x1="705.0" y1="344" x2="437.0" y2="344" stroke="#d97706" stroke-width="2.2" marker-end="url(#arrow-broadcast)" />
    <circle cx="705.0" cy="344" r="3.5" fill="#d97706" />
  </g>
  <g>
    <text x="290.0" y="436" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Set Agent Control Command</text>
    <line x1="155.0" y1="446" x2="423.0" y2="446" stroke="#1e3a8a" stroke-width="2.2" marker-end="url(#arrow-primary)" />
    <circle cx="155.0" cy="446" r="3.5" fill="#1e3a8a" />
  </g>
  <g>
    <text x="290.0" y="484" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Set Agent Control Params</text>
    <line x1="155.0" y1="494" x2="423.0" y2="494" stroke="#1e3a8a" stroke-width="2.2" marker-end="url(#arrow-primary)" />
    <circle cx="155.0" cy="494" r="3.5" fill="#1e3a8a" />
  </g>
  <g>
    <text x="290.0" y="532" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Set Agent User Params</text>
    <line x1="155.0" y1="542" x2="423.0" y2="542" stroke="#1e3a8a" stroke-width="2.2" marker-end="url(#arrow-primary)" />
    <circle cx="155.0" cy="542" r="3.5" fill="#1e3a8a" />
  </g>
  <g>
    <text x="570.0" y="580" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Set Agent Control</text>
    <line x1="435.0" y1="590" x2="703.0" y2="590" stroke="#1e3a8a" stroke-width="2.2" marker-end="url(#arrow-primary)" />
    <circle cx="435.0" cy="590" r="3.5" fill="#1e3a8a" />
  </g>
  <g>
    <text x="570.0" y="628" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Query Agent Status</text>
    <line x1="435.0" y1="638" x2="703.0" y2="638" stroke="#1e3a8a" stroke-width="2.2" marker-end="url(#arrow-primary)" />
    <circle cx="435.0" cy="638" r="3.5" fill="#1e3a8a" />
  </g>
  <g>
    <text x="570.0" y="676" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Report Agent Status</text>
    <line x1="705.0" y1="686" x2="437.0" y2="686" stroke="#d97706" stroke-width="2.2" marker-end="url(#arrow-broadcast)" />
    <circle cx="705.0" cy="686" r="3.5" fill="#d97706" />
  </g>
  <g>
    <text x="570.0" y="724" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Report Agent Complete</text>
    <line x1="705.0" y1="734" x2="437.0" y2="734" stroke="#d97706" stroke-width="2.2" marker-end="url(#arrow-broadcast)" />
    <circle cx="705.0" cy="734" r="3.5" fill="#d97706" />
  </g>
</svg>
