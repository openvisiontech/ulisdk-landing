<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg version="1.1" viewBox="0 0 980 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients for OVT signature orange frame and light-blue inner panel -->
    <linearGradient id="orange-frame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb03a" />
      <stop offset="50%" stop-color="#ff9900" />
      <stop offset="100%" stop-color="#e08200" />
    </linearGradient>

    <linearGradient id="blue-panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eaf3fb" />
      <stop offset="100%" stop-color="#cfe2f3" />
    </linearGradient>

    <linearGradient id="bg-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Arrowhead markers -->
    <marker id="arrow-primary" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0.5 L 9.5 4 L 0 7.5 L 1.8 4 Z" fill="#1e3a8a" />
    </marker>

    <marker id="arrow-broadcast" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0.5 L 9.5 4 L 0 7.5 L 1.8 4 Z" fill="#d97706" />
    </marker>
  </defs>
  <!-- Main Diagram Container Card -->
  <rect x="10" y="10" width="960" height="580" rx="14" fill="url(#bg-card)" stroke="#cbd5e1" stroke-width="1.5" />
  <!-- Subtle Phase Background Bands -->
  <rect x="28" y="114" width="924" height="214" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1" />
  <rect x="28" y="340" width="924" height="214" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1" />
  <!-- Lifelines -->
  <g stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,5">
    <line x1="110.0" y1="94" x2="110.0" y2="572" />
    <line x1="300.0" y1="94" x2="300.0" y2="572" />
    <line x1="490.0" y1="94" x2="490.0" y2="572" />
    <line x1="680.0" y1="94" x2="680.0" y2="572" />
    <line x1="870.0" y1="94" x2="870.0" y2="572" />
  </g>
  <!-- Phase Header Badges -->
  <g>
    <rect x="38" y="122" width="289" height="20" rx="5" fill="#e2e8f0" />
    <text x="48" y="136" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#475569" letter-spacing="0.5">PHASE 1: SUBSYSTEM ACCESS AUTHORIZATION</text>
    <rect x="38" y="348" width="336" height="20" rx="5" fill="#e2e8f0" />
    <text x="48" y="362" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#475569" letter-spacing="0.5">PHASE 2: DATA TOPIC SUBSCRIPTION &amp; TCP SESSION</text>
  </g>
  <!-- Lifeline Bottom End Caps -->
  <g fill="#64748b">
    <rect x="94.0" y="570" width="32" height="5" rx="2.5" />
    <rect x="284.0" y="570" width="32" height="5" rx="2.5" />
    <rect x="474.0" y="570" width="32" height="5" rx="2.5" />
    <rect x="664.0" y="570" width="32" height="5" rx="2.5" />
    <rect x="854.0" y="570" width="32" height="5" rx="2.5" />
  </g>
  <!-- Activation Bars on Lifelines -->
  <rect x="105.0" y="162" width="10" height="82" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2" />
  <rect x="485.0" y="162" width="10" height="144" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2" />
  <rect x="675.0" y="286" width="10" height="20" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2" />
  <rect x="295.0" y="402" width="10" height="130" rx="3" fill="#ffedd5" stroke="#f59e0b" stroke-width="1.2" />
  <rect x="865.0" y="402" width="10" height="130" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2" />
  <!-- Actor Header Boxes -->
  <g>
    <rect x="29.0" y="33" width="166" height="64" rx="9" fill="#0f172a" fill-opacity="0.12" />
    <rect x="27.0" y="30" width="166" height="64" rx="9" fill="url(#orange-frame)" stroke="#b45309" stroke-width="1.2" />
    <rect x="35.0" y="37" width="150" height="50" rx="5" fill="url(#blue-panel)" stroke="#475569" stroke-width="1" />
    <text x="110.0" y="58" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a" text-anchor="middle">OCU (Subsystem</text>
    <text x="110.0" y="75" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Access Client)</text>
  </g>
  <g>
    <rect x="219.0" y="33" width="166" height="64" rx="9" fill="#0f172a" fill-opacity="0.12" />
    <rect x="217.0" y="30" width="166" height="64" rx="9" fill="url(#orange-frame)" stroke="#b45309" stroke-width="1.2" />
    <rect x="225.0" y="37" width="150" height="50" rx="5" fill="url(#blue-panel)" stroke="#475569" stroke-width="1" />
    <text x="300.0" y="58" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a" text-anchor="middle">OCU (Data</text>
    <text x="300.0" y="75" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Topic Client)</text>
  </g>
  <g>
    <rect x="409.0" y="33" width="166" height="64" rx="9" fill="#0f172a" fill-opacity="0.12" />
    <rect x="407.0" y="30" width="166" height="64" rx="9" fill="url(#orange-frame)" stroke="#b45309" stroke-width="1.2" />
    <rect x="415.0" y="37" width="150" height="50" rx="5" fill="url(#blue-panel)" stroke="#475569" stroke-width="1" />
    <text x="490.0" y="58" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Subsystem</text>
    <text x="490.0" y="75" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Access</text>
  </g>
  <g>
    <rect x="599.0" y="33" width="166" height="64" rx="9" fill="#0f172a" fill-opacity="0.12" />
    <rect x="597.0" y="30" width="166" height="64" rx="9" fill="url(#orange-frame)" stroke="#b45309" stroke-width="1.2" />
    <rect x="605.0" y="37" width="150" height="50" rx="5" fill="url(#blue-panel)" stroke="#475569" stroke-width="1" />
    <text x="680.0" y="67" font-family="Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Comp Access</text>
  </g>
  <g>
    <rect x="789.0" y="33" width="166" height="64" rx="9" fill="#0f172a" fill-opacity="0.12" />
    <rect x="787.0" y="30" width="166" height="64" rx="9" fill="url(#orange-frame)" stroke="#b45309" stroke-width="1.2" />
    <rect x="795.0" y="37" width="150" height="50" rx="5" fill="url(#blue-panel)" stroke="#475569" stroke-width="1" />
    <text x="870.0" y="67" font-family="Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Data Topic</text>
  </g>
  <!-- Sequence Elements -->
  <g>
    <text x="205.0" y="162" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Request Subsystem Access</text>
    <line x1="115.0" y1="172" x2="483.0" y2="172" stroke="#1e3a8a" stroke-width="2.2" marker-end="url(#arrow-primary)" />
    <circle cx="115.0" cy="172" r="3.5" fill="#1e3a8a" />
  </g>
  <g>
    <text x="205.0" y="204" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Confirm Subsystem Access</text>
    <rect x="76.5" y="209" width="257" height="18" rx="9" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1" />
    <text x="205.0" y="222" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#075985" text-anchor="middle">(Session Uuid, App/Data Access Rights)</text>
    <line x1="485.0" y1="234" x2="117.0" y2="234" stroke="#d97706" stroke-width="2.2" marker-end="url(#arrow-broadcast)" />
    <circle cx="485.0" cy="234" r="3.5" fill="#d97706" />
  </g>
  <g>
    <text x="585.0" y="266" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Access Recs</text>
    <rect x="509.0" y="271" width="152" height="18" rx="9" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" />
    <text x="585.0" y="284" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#92400e" text-anchor="middle">(subsystem-broadcast)</text>
    <line x1="495.0" y1="296" x2="673.0" y2="296" stroke="#d97706" stroke-width="2.2" marker-end="url(#arrow-broadcast)" />
    <circle cx="495.0" cy="296" r="3.5" fill="#d97706" />
  </g>
  <g>
    <text x="395.0" y="382" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Subscribe Data Topics</text>
    <rect x="341.0" y="387" width="108" height="18" rx="9" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1" />
    <text x="395.0" y="400" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#075985" text-anchor="middle">(Session Uuid)</text>
    <line x1="305.0" y1="412" x2="863.0" y2="412" stroke="#1e3a8a" stroke-width="2.2" marker-end="url(#arrow-primary)" />
    <circle cx="305.0" cy="412" r="3.5" fill="#1e3a8a" />
  </g>
  <g>
    <text x="395.0" y="450" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Establish TCP session</text>
    <line x1="305.0" y1="460" x2="863.0" y2="460" stroke="#1e3a8a" stroke-width="2.2" marker-end="url(#arrow-primary)" />
    <circle cx="305.0" cy="460" r="3.5" fill="#1e3a8a" />
  </g>
  <g>
    <text x="395.0" y="492" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Keep Alive TCP session</text>
    <rect x="341.0" y="497" width="108" height="18" rx="9" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1" />
    <text x="395.0" y="510" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#075985" text-anchor="middle">(Session Uuid)</text>
    <line x1="305.0" y1="522" x2="863.0" y2="522" stroke="#1e3a8a" stroke-width="2.2" marker-end="url(#arrow-primary)" />
    <circle cx="305.0" cy="522" r="3.5" fill="#1e3a8a" />
  </g>
</svg>
