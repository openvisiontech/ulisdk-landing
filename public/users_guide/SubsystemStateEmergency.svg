  <g>
    <rect x="320.5" y="592" width="99" height="20" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="1.2" />
    <text x="370.0" y="606" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#166534" text-anchor="middle">OPERATIONAL</text>
  </g>
  <g>
    <text x="460.0" y="628" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Subsystem Broadcast</text>
    <rect x="396.5" y="633" width="127" height="18" rx="9" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" />
    <text x="460.0" y="646" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#92400e" text-anchor="middle">(Clear Emergency)</text>
    <line x1="375.0" y1="658" x2="723.0" y2="658" stroke="#d97706" stroke-width="2.2" marker-end="url(#arrow-broadcast)" />
    <circle cx="375.0" cy="658" r="3.5" fill="#d97706" />
  </g>
