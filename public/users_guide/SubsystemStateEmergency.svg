    <text x="280.0" y="550" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#075985" text-anchor="middle">(Operational)</text>
    <line x1="195.0" y1="562" x2="363.0" y2="562" stroke="#1e3a8a" stroke-width="2.2" marker-end="url(#arrow-primary)" />
    <circle cx="195.0" cy="562" r="3.5" fill="#1e3a8a" />
