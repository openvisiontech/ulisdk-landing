  <g>
    <rect x="474.0" y="33" width="156" height="64" rx="9" fill="#0f172a" fill-opacity="0.12" />
    <rect x="472.0" y="30" width="156" height="64" rx="9" fill="url(#orange-frame)" stroke="#b45309" stroke-width="1.2" />
    <rect x="480.0" y="37" width="140" height="50" rx="5" fill="url(#blue-panel)" stroke="#475569" stroke-width="1" />
