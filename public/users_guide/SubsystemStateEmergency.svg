  <rect x="365.0" y="258" width="10" height="116" rx="3" fill="#ffedd5" stroke="#f59e0b" stroke-width="1.2" />
  <rect x="725.0" y="154" width="10" height="262" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2" />
