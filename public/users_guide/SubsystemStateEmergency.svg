    <circle cx="375.0" cy="740" r="3.5" fill="#1e3a8a" />
  </g>
  <g>
    <text x="460.0" y="778" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Report Subsystem Management States</text>
    <line x1="545.0" y1="788" x2="377.0" y2="788" stroke="#d97706" stroke-width="2.2" marker-end="url(#arrow-broadcast)" />
    <circle cx="545.0" cy="788" r="3.5" fill="#d97706" />
