<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg version="1.1" viewBox="0 0 920 495" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients for OVT signature orange frame and light-blue inner panel -->
    <linearGradient id="orange-frame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb03a" />
      <stop offset="50%" stop-color="#ff9900" />
      <stop offset="100%" stop-color="#e08200" />
    </linearGradient>

    <linearGradient id="blue-panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eaf3fb" />
      <stop offset="100%" stop-color="#cfe2f3" />
    </linearGradient>

    <linearGradient id="bg-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Arrowhead markers -->
    <marker id="arrow-primary" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0.5 L 9.5 4 L 0 7.5 L 1.8 4 Z" fill="#1e3a8a" />
    </marker>

    <marker id="arrow-report" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0.5 L 9.5 4 L 0 7.5 L 1.8 4 Z" fill="#d97706" />
    </marker>
  </defs>

  <!-- Main Diagram Container Card -->
  <rect x="10" y="10" width="900" height="475" rx="14" fill="url(#bg-card)" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Subtle Phase Background Bands -->
  <!-- Phase 1: Agent Registration -->
  <rect x="28" y="114" width="864" height="86" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1" />
  <!-- Phase 2: Agent Discovery & Status Query -->
  <rect x="28" y="212" width="864" height="244" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1" />

  <!-- Lifelines -->
  <g stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,5">
    <line x1="130" y1="94" x2="130" y2="464" />
    <line x1="350" y1="94" x2="350" y2="464" />
    <line x1="570" y1="94" x2="570" y2="464" />
    <line x1="790" y1="94" x2="790" y2="464" />
  </g>

  <!-- Phase Header Badges (Opaque so lifelines don't cut through text) -->
  <g>
    <rect x="38" y="122" width="212" height="20" rx="5" fill="#e2e8f0" />
    <text x="48" y="136" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#475569" letter-spacing="0.5">PHASE 1: AGENT REGISTRATION</text>

    <rect x="38" y="220" width="280" height="20" rx="5" fill="#e2e8f0" />
    <text x="48" y="234" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#475569" letter-spacing="0.5">PHASE 2: AGENT DISCOVERY &amp; STATUS QUERY</text>
  </g>

  <!-- Lifeline Bottom End Caps -->
  <g fill="#64748b">
    <rect x="114" y="462" width="32" height="5" rx="2.5" />
    <rect x="334" y="462" width="32" height="5" rx="2.5" />
    <rect x="554" y="462" width="32" height="5" rx="2.5" />
    <rect x="774" y="462" width="32" height="5" rx="2.5" />
  </g>

  <!-- Activation Bars on Lifelines -->
  <!-- OCU active during steps 2-5 -->
  <rect x="125" y="258" width="10" height="184" rx="3" fill="#ffedd5" stroke="#f59e0b" stroke-width="1.2" />
  <!-- Agent Discovery active during steps 1-3 -->
  <rect x="345" y="162" width="10" height="172" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2" />
  <!-- Agent Register active during step 1 -->
  <rect x="565" y="162" width="10" height="24" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2" />
  <!-- Agent active during steps 4-5 -->
  <rect x="785" y="366" width="10" height="76" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2" />

  <!-- ================= ACTOR HEADER BOXES ================= -->
  <!-- Actor 1: OCU (Agent Discovery Client) (x=130) -->
  <g>
    <rect x="47" y="33" width="170" height="64" rx="9" fill="#0f172a" fill-opacity="0.12" />
    <rect x="45" y="30" width="170" height="64" rx="9" fill="url(#orange-frame)" stroke="#b45309" stroke-width="1.2" />
    <rect x="53" y="37" width="154" height="50" rx="5" fill="url(#blue-panel)" stroke="#475569" stroke-width="1" />
    <text x="130" y="58" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">OCU (Agent</text>
    <text x="130" y="75" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Discovery Client)</text>
  </g>

  <!-- Actor 2: Agent Discovery (x=350) -->
  <g>
    <rect x="267" y="33" width="170" height="64" rx="9" fill="#0f172a" fill-opacity="0.12" />
    <rect x="265" y="30" width="170" height="64" rx="9" fill="url(#orange-frame)" stroke="#b45309" stroke-width="1.2" />
    <rect x="273" y="37" width="154" height="50" rx="5" fill="url(#blue-panel)" stroke="#475569" stroke-width="1" />
    <text x="350" y="67" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Agent Discovery</text>
  </g>

  <!-- Actor 3: Agent Register (x=570) -->
  <g>
    <rect x="487" y="33" width="170" height="64" rx="9" fill="#0f172a" fill-opacity="0.12" />
    <rect x="485" y="30" width="170" height="64" rx="9" fill="url(#orange-frame)" stroke="#b45309" stroke-width="1.2" />
    <rect x="493" y="37" width="154" height="50" rx="5" fill="url(#blue-panel)" stroke="#475569" stroke-width="1" />
    <text x="570" y="67" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Agent Register</text>
  </g>

  <!-- Actor 4: Agent (x=790) -->
  <g>
    <rect x="707" y="33" width="170" height="64" rx="9" fill="#0f172a" fill-opacity="0.12" />
    <rect x="705" y="30" width="170" height="64" rx="9" fill="url(#orange-frame)" stroke="#b45309" stroke-width="1.2" />
    <rect x="713" y="37" width="154" height="50" rx="5" fill="url(#blue-panel)" stroke="#475569" stroke-width="1" />
    <text x="790" y="67" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Agent</text>
  </g>

  <!-- ================= SEQUENCE MESSAGES ================= -->

  <!-- 1. Agent Register -> Agent Discovery: Register Agent -->
  <g>
    <text x="460" y="164" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Register Agent</text>
    <line x1="565" y1="174" x2="357" y2="174" stroke="#1e3a8a" stroke-width="2.2" marker-end="url(#arrow-primary)" />
    <circle cx="565" cy="174" r="3.5" fill="#1e3a8a" />
  </g>

  <!-- 2. OCU (Agent Discovery Client) -> Agent Discovery: Query Agents -->
  <g>
    <text x="240" y="260" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Query Agents</text>
    <line x1="135" y1="270" x2="343" y2="270" stroke="#1e3a8a" stroke-width="2.2" marker-end="url(#arrow-primary)" />
    <circle cx="135" cy="270" r="3.5" fill="#1e3a8a" />
  </g>

  <!-- 3. Agent Discovery -> OCU (Agent Discovery Client): Report Agents -->
  <g>
    <text x="240" y="312" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Report Agents</text>
    <line x1="345" y1="322" x2="137" y2="322" stroke="#d97706" stroke-width="2.2" marker-end="url(#arrow-report)" />
    <circle cx="345" cy="322" r="3.5" fill="#d97706" />
  </g>

  <!-- 4. OCU (Agent Discovery Client) -> Agent: Query Agent Status -->
  <g>
    <text x="240" y="368" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Query Agent Status</text>
    <line x1="135" y1="378" x2="783" y2="378" stroke="#1e3a8a" stroke-width="2.2" marker-end="url(#arrow-primary)" />
    <circle cx="135" cy="378" r="3.5" fill="#1e3a8a" />
  </g>

  <!-- 5. Agent -> OCU (Agent Discovery Client): Report Agent Status -->
  <g>
    <text x="680" y="420" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Report Agent Status</text>
    <line x1="785" y1="430" x2="137" y2="430" stroke="#d97706" stroke-width="2.2" marker-end="url(#arrow-report)" />
    <circle cx="785" cy="430" r="3.5" fill="#d97706" />
  </g>
</svg>
