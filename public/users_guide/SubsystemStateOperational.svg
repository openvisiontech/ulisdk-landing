<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg version="1.1" viewBox="0 0 980 604" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients for OVT signature orange frame and light-blue inner panel -->
    <linearGradient id="orange-frame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb03a" />
      <stop offset="50%" stop-color="#ff9900" />
      <stop offset="100%" stop-color="#e08200" />
    </linearGradient>

    <linearGradient id="blue-panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eaf3fb" />
      <stop offset="100%" stop-color="#cfe2f3" />
    </linearGradient>

    <linearGradient id="bg-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Arrowhead markers -->
    <marker id="arrow-primary" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0.5 L 9.5 4 L 0 7.5 L 1.8 4 Z" fill="#1e3a8a" />
    </marker>

    <marker id="arrow-broadcast" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0.5 L 9.5 4 L 0 7.5 L 1.8 4 Z" fill="#d97706" />
    </marker>
  </defs>
  <!-- Main Diagram Container Card -->
  <rect x="10" y="10" width="960" height="584" rx="14" fill="url(#bg-card)" stroke="#cbd5e1" stroke-width="1.5" />
  <!-- Subtle Phase Background Bands -->
  <rect x="28" y="114" width="924" height="308" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1" />
  <rect x="28" y="434" width="924" height="124" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1" />
  <!-- Lifelines -->
  <g stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,5">
    <line x1="110.0" y1="94" x2="110.0" y2="576" />
    <line x1="300.0" y1="94" x2="300.0" y2="576" />
    <line x1="490.0" y1="94" x2="490.0" y2="576" />
    <line x1="680.0" y1="94" x2="680.0" y2="576" />
    <line x1="870.0" y1="94" x2="870.0" y2="576" />
  </g>
  <!-- Phase Header Badges -->
  <g>
    <rect x="38" y="122" width="377" height="20" rx="5" fill="#e2e8f0" />
    <text x="48" y="136" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#475569" letter-spacing="0.5">PHASE 1: OPERATIONAL STATE VERIFICATION &amp; ACTIVATION</text>
    <rect x="38" y="442" width="241" height="20" rx="5" fill="#e2e8f0" />
    <text x="48" y="456" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#475569" letter-spacing="0.5">PHASE 2: COMPONENT GO ACTIVATION</text>
  </g>
  <!-- Lifeline Bottom End Caps -->
  <g fill="#64748b">
    <rect x="94.0" y="574" width="32" height="5" rx="2.5" />
    <rect x="284.0" y="574" width="32" height="5" rx="2.5" />
    <rect x="474.0" y="574" width="32" height="5" rx="2.5" />
    <rect x="664.0" y="574" width="32" height="5" rx="2.5" />
    <rect x="854.0" y="574" width="32" height="5" rx="2.5" />
  </g>
  <!-- Activation Bars on Lifelines -->
  <rect x="105.0" y="162" width="10" height="20" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2" />
  <rect x="485.0" y="162" width="10" height="246" rx="3" fill="#ffedd5" stroke="#f59e0b" stroke-width="1.2" />
  <rect x="675.0" y="210" width="10" height="102" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2" />
  <rect x="865.0" y="250" width="10" height="22" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2" />
  <rect x="295.0" y="482" width="10" height="20" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2" />
  <rect x="865.0" y="482" width="10" height="62" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2" />
  <!-- Actor Header Boxes -->
  <g>
    <rect x="29.0" y="33" width="166" height="64" rx="9" fill="#0f172a" fill-opacity="0.12" />
    <rect x="27.0" y="30" width="166" height="64" rx="9" fill="url(#orange-frame)" stroke="#b45309" stroke-width="1.2" />
    <rect x="35.0" y="37" width="150" height="50" rx="5" fill="url(#blue-panel)" stroke="#475569" stroke-width="1" />
    <text x="110.0" y="58" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a" text-anchor="middle">OCU (Subsystem</text>
    <text x="110.0" y="75" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a" text-anchor="middle">State Client)</text>
  </g>
  <g>
    <rect x="219.0" y="33" width="166" height="64" rx="9" fill="#0f172a" fill-opacity="0.12" />
    <rect x="217.0" y="30" width="166" height="64" rx="9" fill="url(#orange-frame)" stroke="#b45309" stroke-width="1.2" />
    <rect x="225.0" y="37" width="150" height="50" rx="5" fill="url(#blue-panel)" stroke="#475569" stroke-width="1" />
    <text x="300.0" y="58" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a" text-anchor="middle">OCU (Management</text>
    <text x="300.0" y="75" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Client)</text>
  </g>
  <g>
    <rect x="409.0" y="33" width="166" height="64" rx="9" fill="#0f172a" fill-opacity="0.12" />
    <rect x="407.0" y="30" width="166" height="64" rx="9" fill="url(#orange-frame)" stroke="#b45309" stroke-width="1.2" />
    <rect x="415.0" y="37" width="150" height="50" rx="5" fill="url(#blue-panel)" stroke="#475569" stroke-width="1" />
    <text x="490.0" y="58" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Subsystem</text>
    <text x="490.0" y="75" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a" text-anchor="middle">State</text>
  </g>
  <g>
    <rect x="599.0" y="33" width="166" height="64" rx="9" fill="#0f172a" fill-opacity="0.12" />
    <rect x="597.0" y="30" width="166" height="64" rx="9" fill="url(#orange-frame)" stroke="#b45309" stroke-width="1.2" />
    <rect x="605.0" y="37" width="150" height="50" rx="5" fill="url(#blue-panel)" stroke="#475569" stroke-width="1" />
    <text x="680.0" y="67" font-family="Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Status Monitor</text>
  </g>
  <g>
    <rect x="789.0" y="33" width="166" height="64" rx="9" fill="#0f172a" fill-opacity="0.12" />
    <rect x="787.0" y="30" width="166" height="64" rx="9" fill="url(#orange-frame)" stroke="#b45309" stroke-width="1.2" />
    <rect x="795.0" y="37" width="150" height="50" rx="5" fill="url(#blue-panel)" stroke="#475569" stroke-width="1" />
    <text x="870.0" y="67" font-family="Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Management</text>
  </g>
  <!-- Sequence Elements -->
  <g>
    <text x="205.0" y="162" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Set Subsystem State (Operational)</text>
    <line x1="115.0" y1="172" x2="483.0" y2="172" stroke="#1e3a8a" stroke-width="2.2" marker-end="url(#arrow-primary)" />
    <circle cx="115.0" cy="172" r="3.5" fill="#1e3a8a" />
  </g>
  <g>
    <text x="585.0" y="210" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Query Subsystem Management States</text>
    <line x1="495.0" y1="220" x2="673.0" y2="220" stroke="#1e3a8a" stroke-width="2.2" marker-end="url(#arrow-primary)" />
    <circle cx="495.0" cy="220" r="3.5" fill="#1e3a8a" />
  </g>
  <g>
    <rect x="824.0" y="250" width="92" height="20" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2" />
    <text x="870.0" y="264" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#334155" text-anchor="middle">STAND_BY</text>
  </g>
  <g>
    <text x="585.0" y="292" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Report Subsystem Management States</text>
    <line x1="675.0" y1="302" x2="497.0" y2="302" stroke="#d97706" stroke-width="2.2" marker-end="url(#arrow-broadcast)" />
    <circle cx="675.0" cy="302" r="3.5" fill="#d97706" />
  </g>
  <g>
    <rect x="379.0" y="330" width="222" height="42" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" />
    <text x="490.0" y="346" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#334155" text-anchor="middle">Check all management states</text>
    <text x="490.0" y="360" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#334155" text-anchor="middle">are in either STAND_BY or READY</text>
  </g>
  <g>
    <rect x="440.5" y="386" width="99" height="20" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="1.2" />
    <text x="490.0" y="400" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#166534" text-anchor="middle">OPERATIONAL</text>
  </g>
  <g>
    <text x="395.0" y="482" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Go</text>
    <line x1="305.0" y1="492" x2="863.0" y2="492" stroke="#1e3a8a" stroke-width="2.2" marker-end="url(#arrow-primary)" />
    <circle cx="305.0" cy="492" r="3.5" fill="#1e3a8a" />
  </g>
  <g>
    <rect x="824.0" y="522" width="92" height="20" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="1.2" />
    <text x="870.0" y="536" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#166534" text-anchor="middle">READY</text>
  </g>
</svg>
