<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg version="1.1" viewBox="0 0 860 555" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients for OVT signature orange frame and light-blue inner panel -->
    <linearGradient id="orange-frame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb03a" />
      <stop offset="50%" stop-color="#ff9900" />
      <stop offset="100%" stop-color="#e08200" />
    </linearGradient>

    <linearGradient id="blue-panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eaf3fb" />
      <stop offset="100%" stop-color="#cfe2f3" />
    </linearGradient>

    <linearGradient id="bg-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Arrowhead markers -->
    <marker id="arrow-primary" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0.5 L 9.5 4 L 0 7.5 L 1.8 4 Z" fill="#1e3a8a" />
    </marker>

    <marker id="arrow-broadcast" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0.5 L 9.5 4 L 0 7.5 L 1.8 4 Z" fill="#d97706" />
    </marker>
  </defs>

  <!-- Main Diagram Container Card -->
  <rect x="10" y="10" width="840" height="535" rx="14" fill="url(#bg-card)" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Subtle Phase Background Bands -->
  <!-- Phase 1: Subsystem Registration & Node ID Allocation -->
  <rect x="28" y="114" width="804" height="258" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1" />
  <!-- Phase 2: Component Discovery & Readiness -->
  <rect x="28" y="384" width="804" height="132" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1" />

  <!-- Lifelines -->
  <g stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,5">
    <line x1="150" y1="94" x2="150" y2="524" />
    <line x1="430" y1="94" x2="430" y2="524" />
    <line x1="710" y1="94" x2="710" y2="524" />
  </g>

  <!-- Phase Header Badges (Opaque so lifelines don't cut through text) -->
  <g>
    <rect x="38" y="122" width="286" height="20" rx="5" fill="#e2e8f0" />
    <text x="48" y="136" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#475569" letter-spacing="0.5">PHASE 1: SUBSYSTEM &amp; NODE ID ALLOCATION</text>

    <rect x="38" y="392" width="246" height="20" rx="5" fill="#e2e8f0" />
    <text x="48" y="406" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#475569" letter-spacing="0.5">PHASE 2: COMPONENT INITIALIZATION</text>
  </g>

  <!-- Lifeline Bottom End Caps -->
  <g fill="#64748b">
    <rect x="134" y="522" width="32" height="5" rx="2.5" />
    <rect x="414" y="522" width="32" height="5" rx="2.5" />
    <rect x="694" y="522" width="32" height="5" rx="2.5" />
  </g>

  <!-- Activation Bars on Lifelines -->
  <!-- Subsystem Manager active during steps 1-4 -->
  <rect x="145" y="176" width="10" height="184" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2" />
  <!-- Node Manager active during steps 1-6 -->
  <rect x="425" y="176" width="10" height="328" rx="3" fill="#ffedd5" stroke="#f59e0b" stroke-width="1.2" />
  <!-- Comp active during steps 5-6 -->
  <rect x="705" y="436" width="10" height="68" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2" />

  <!-- ================= ACTOR HEADER BOXES ================= -->
  <!-- Actor 1: Subsystem Manager (x=150) -->
  <g>
    <rect x="67" y="33" width="170" height="64" rx="9" fill="#0f172a" fill-opacity="0.12" />
    <rect x="65" y="30" width="170" height="64" rx="9" fill="url(#orange-frame)" stroke="#b45309" stroke-width="1.2" />
    <rect x="73" y="37" width="154" height="50" rx="5" fill="url(#blue-panel)" stroke="#475569" stroke-width="1" />
    <text x="150" y="67" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Subsystem Manager</text>
  </g>

  <!-- Actor 2: Node Manager (x=430) -->
  <g>
    <rect x="347" y="33" width="170" height="64" rx="9" fill="#0f172a" fill-opacity="0.12" />
    <rect x="345" y="30" width="170" height="64" rx="9" fill="url(#orange-frame)" stroke="#b45309" stroke-width="1.2" />
    <rect x="353" y="37" width="154" height="50" rx="5" fill="url(#blue-panel)" stroke="#475569" stroke-width="1" />
    <text x="430" y="67" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Node Manager</text>
  </g>

  <!-- Actor 3: Comp (x=710) -->
  <g>
    <rect x="627" y="33" width="170" height="64" rx="9" fill="#0f172a" fill-opacity="0.12" />
    <rect x="625" y="30" width="170" height="64" rx="9" fill="url(#orange-frame)" stroke="#b45309" stroke-width="1.2" />
    <rect x="633" y="37" width="154" height="50" rx="5" fill="url(#blue-panel)" stroke="#475569" stroke-width="1" />
    <text x="710" y="67" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Comp</text>
  </g>

  <!-- ================= SEQUENCE MESSAGES ================= -->

  <!-- 1. Subsystem Manager -> Node Manager: Subsystem Manager Ready (subsystem broadcast) -->
  <g>
    <text x="290" y="158" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Subsystem Manager Ready</text>
    <rect x="223" y="163" width="134" height="18" rx="9" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" />
    <text x="290" y="176" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#92400e" text-anchor="middle">(subsystem broadcast)</text>
    <line x1="155" y1="188" x2="423" y2="188" stroke="#d97706" stroke-width="2.2" marker-end="url(#arrow-broadcast)" />
    <circle cx="155" cy="188" r="3.5" fill="#d97706" />
  </g>

  <!-- 2. Node Manager -> Subsystem Manager: Node ID Request -->
  <g>
    <text x="290" y="224" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Node ID Request</text>
    <line x1="425" y1="234" x2="157" y2="234" stroke="#1e3a8a" stroke-width="2.2" marker-end="url(#arrow-primary)" />
    <circle cx="425" cy="234" r="3.5" fill="#1e3a8a" />
  </g>

  <!-- 3. Subsystem Manager -> Node Manager: Node ID Allocated (subsystem-broadcast) -->
  <g>
    <text x="290" y="272" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Node ID Allocated</text>
    <rect x="222" y="277" width="136" height="18" rx="9" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" />
    <text x="290" y="290" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#92400e" text-anchor="middle">(subsystem-broadcast)</text>
    <line x1="155" y1="302" x2="423" y2="302" stroke="#d97706" stroke-width="2.2" marker-end="url(#arrow-broadcast)" />
    <circle cx="155" cy="302" r="3.5" fill="#d97706" />
  </g>

  <!-- 4. Node Manager -> Subsystem Manager: Node Ready -->
  <g>
    <text x="290" y="338" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Node Ready</text>
    <line x1="425" y1="348" x2="157" y2="348" stroke="#1e3a8a" stroke-width="2.2" marker-end="url(#arrow-primary)" />
    <circle cx="425" cy="348" r="3.5" fill="#1e3a8a" />
  </g>

  <!-- 5. Node Manager -> Comp: Node Manager Ready (node-broadcast) -->
  <g>
    <text x="570" y="418" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Node Manager Ready</text>
    <rect x="515" y="423" width="110" height="18" rx="9" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" />
    <text x="570" y="436" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#92400e" text-anchor="middle">(node-broadcast)</text>
    <line x1="435" y1="448" x2="703" y2="448" stroke="#d97706" stroke-width="2.2" marker-end="url(#arrow-broadcast)" />
    <circle cx="435" cy="448" r="3.5" fill="#d97706" />
  </g>

  <!-- 6. Comp -> Node Manager: Component Ready -->
  <g>
    <text x="570" y="482" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Component Ready</text>
    <line x1="705" y1="492" x2="437" y2="492" stroke="#1e3a8a" stroke-width="2.2" marker-end="url(#arrow-primary)" />
    <circle cx="705" cy="492" r="3.5" fill="#1e3a8a" />
  </g>
</svg>
