  <g>
    <rect x="370.0" y="154" width="120" height="20" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2" />
    <text x="430.0" y="168" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#334155" text-anchor="middle">NOT CONTROLLED</text>
    <rect x="650.0" y="154" width="120" height="20" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2" />
    <text x="710.0" y="168" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#334155" text-anchor="middle">NOT CONTROLLED</text>
