    <text x="290.0" y="386" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#075985" text-anchor="middle">(Session Uuid)</text>
    <line x1="425.0" y1="398" x2="157.0" y2="398" stroke="#d97706" stroke-width="2.2" marker-end="url(#arrow-broadcast)" />
    <circle cx="425.0" cy="398" r="3.5" fill="#d97706" />
