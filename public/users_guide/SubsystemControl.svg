    <rect x="516.0" y="469" width="108" height="18" rx="9" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" />
    <text x="570.0" y="482" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#92400e" text-anchor="middle">(Session Uuid)</text>
    <line x1="435.0" y1="494" x2="703.0" y2="494" stroke="#d97706" stroke-width="2.2" marker-end="url(#arrow-broadcast)" />
    <circle cx="435.0" cy="494" r="3.5" fill="#d97706" />
  </g>
  <g>
    <text x="290.0" y="580" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Request Subsystem Control</text>
    <rect x="236.0" y="585" width="108" height="18" rx="9" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1" />
    <text x="290.0" y="598" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#075985" text-anchor="middle">(Authority)</text>
    <line x1="155.0" y1="610" x2="423.0" y2="610" stroke="#1e3a8a" stroke-width="2.2" marker-end="url(#arrow-primary)" />
    <circle cx="155.0" cy="610" r="3.5" fill="#1e3a8a" />
  </g>
  <g>
    <text x="290.0" y="642" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Request Control</text>
    <rect x="201.5" y="647" width="177" height="18" rx="9" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1" />
    <text x="290.0" y="660" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#075985" text-anchor="middle">(Session Uuid, Authority)</text>
    <line x1="155.0" y1="672" x2="703.0" y2="672" stroke="#1e3a8a" stroke-width="2.2" marker-end="url(#arrow-primary)" />
    <circle cx="155.0" cy="672" r="3.5" fill="#1e3a8a" />
  </g>
  <g>
    <rect x="618.0" y="700" width="184" height="42" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" />
    <text x="710.0" y="716" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#334155" text-anchor="middle">Validate Session Uuid and</text>
    <text x="710.0" y="730" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#334155" text-anchor="middle">Compare Authority</text>
  </g>
  <g>
    <rect x="653.5" y="756" width="113" height="20" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="1.2" />
    <text x="710.0" y="770" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#166534" text-anchor="middle">UNDER CONTROL</text>
  </g>
  <g>
    <text x="290.0" y="792" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Release Control</text>
    <rect x="236.0" y="797" width="108" height="18" rx="9" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1" />
    <text x="290.0" y="810" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#075985" text-anchor="middle">(Session Uuid)</text>
    <line x1="155.0" y1="822" x2="703.0" y2="822" stroke="#1e3a8a" stroke-width="2.2" marker-end="url(#arrow-primary)" />
    <circle cx="155.0" cy="822" r="3.5" fill="#1e3a8a" />
  </g>
  <g>
    <rect x="631.0" y="850" width="158" height="28" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" />
    <text x="710.0" y="866" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#334155" text-anchor="middle">Validate Session Uuid</text>
  </g>
  <g>
    <text x="290.0" y="894" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Reject Control</text>
    <rect x="183.0" y="899" width="214" height="18" rx="9" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1" />
    <text x="290.0" y="912" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#075985" text-anchor="middle">(Session Uuid, Reason=Released)</text>
    <line x1="705.0" y1="924" x2="157.0" y2="924" stroke="#d97706" stroke-width="2.2" marker-end="url(#arrow-broadcast)" />
    <circle cx="705.0" cy="924" r="3.5" fill="#d97706" />
  </g>
  <g>
    <rect x="650.0" y="954" width="120" height="20" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2" />
    <text x="710.0" y="968" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#334155" text-anchor="middle">NOT CONTROLLED</text>
  </g>
