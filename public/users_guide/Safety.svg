    <line x1="305.0" y1="350" x2="673.0" y2="350" stroke="#1e3a8a" stroke-width="2.2" marker-end="url(#arrow-primary)" />
    <circle cx="305.0" cy="350" r="3.5" fill="#1e3a8a" />
