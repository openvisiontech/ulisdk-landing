  <rect x="28" y="114" width="924" height="316" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1" />
  <rect x="28" y="442" width="924" height="186" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1" />
