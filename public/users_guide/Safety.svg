  <rect x="485.0" y="244" width="10" height="68" rx="3" fill="#ffedd5" stroke="#f59e0b" stroke-width="1.2" />
  <rect x="675.0" y="244" width="10" height="164" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2" />
