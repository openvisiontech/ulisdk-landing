    <rect x="38" y="450" width="357" height="20" rx="5" fill="#e2e8f0" />
    <text x="48" y="464" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#475569" letter-spacing="0.5">PHASE 2: E-STOP ACTIVATION &amp; EMERGENCY TRANSITION</text>
