    <rect x="284.0" y="644" width="32" height="5" rx="2.5" />
    <rect x="474.0" y="644" width="32" height="5" rx="2.5" />
    <rect x="664.0" y="644" width="32" height="5" rx="2.5" />
    <rect x="854.0" y="644" width="32" height="5" rx="2.5" />
