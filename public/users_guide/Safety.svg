    <line x1="300.0" y1="94" x2="300.0" y2="646" />
    <line x1="490.0" y1="94" x2="490.0" y2="646" />
    <line x1="680.0" y1="94" x2="680.0" y2="646" />
    <line x1="870.0" y1="94" x2="870.0" y2="646" />
