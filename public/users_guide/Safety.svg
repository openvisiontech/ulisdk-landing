    <line x1="495.0" y1="562" x2="863.0" y2="562" stroke="#d97706" stroke-width="2.2" marker-end="url(#arrow-broadcast)" />
    <circle cx="495.0" cy="562" r="3.5" fill="#d97706" />
  </g>
  <g>
    <rect x="824.0" y="592" width="92" height="20" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="1.2" />
    <text x="870.0" y="606" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#991b1b" text-anchor="middle">EMERGENCY</text>
  </g>
