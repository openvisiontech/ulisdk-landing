<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg version="1.1" viewBox="0 0 980 816" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients for OVT signature orange frame and light-blue inner panel -->
    <linearGradient id="orange-frame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb03a" />
      <stop offset="50%" stop-color="#ff9900" />
      <stop offset="100%" stop-color="#e08200" />
    </linearGradient>

    <linearGradient id="blue-panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eaf3fb" />
      <stop offset="100%" stop-color="#cfe2f3" />
    </linearGradient>

    <linearGradient id="bg-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Arrowhead markers -->
    <marker id="arrow-primary" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0.5 L 9.5 4 L 0 7.5 L 1.8 4 Z" fill="#1e3a8a" />
    </marker>

    <marker id="arrow-broadcast" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0.5 L 9.5 4 L 0 7.5 L 1.8 4 Z" fill="#d97706" />
    </marker>
  </defs>
  <!-- Main Diagram Container Card -->
  <rect x="10" y="10" width="960" height="796" rx="14" fill="url(#bg-card)" stroke="#cbd5e1" stroke-width="1.5" />
  <!-- Subtle Phase Background Bands -->
  <rect x="28" y="114" width="924" height="370" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1" />
  <rect x="28" y="496" width="924" height="274" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1" />
  <!-- Lifelines -->
  <g stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,5">
    <line x1="110.0" y1="94" x2="110.0" y2="788" />
    <line x1="300.0" y1="94" x2="300.0" y2="788" />
    <line x1="490.0" y1="94" x2="490.0" y2="788" />
    <line x1="680.0" y1="94" x2="680.0" y2="788" />
    <line x1="870.0" y1="94" x2="870.0" y2="788" />
  </g>
  <!-- Phase Header Badges -->
  <g>
    <rect x="38" y="122" width="391" height="20" rx="5" fill="#e2e8f0" />
    <text x="48" y="136" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#475569" letter-spacing="0.5">PHASE 1: SUBSYSTEM RESET &amp; INITIALIZATION VERIFICATION</text>
    <rect x="38" y="504" width="289" height="20" rx="5" fill="#e2e8f0" />
    <text x="48" y="518" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#475569" letter-spacing="0.5">PHASE 2: SUBSYSTEM START &amp; COMPONENT GO</text>
  </g>
