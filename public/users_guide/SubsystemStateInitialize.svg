  <rect x="485.0" y="162" width="10" height="308" rx="3" fill="#ffedd5" stroke="#f59e0b" stroke-width="1.2" />
  <rect x="675.0" y="306" width="10" height="68" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2" />
  <rect x="865.0" y="224" width="10" height="62" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2" />
  <rect x="295.0" y="694" width="10" height="20" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2" />
  <rect x="485.0" y="558" width="10" height="116" rx="3" fill="#ffedd5" stroke="#f59e0b" stroke-width="1.2" />
  <rect x="865.0" y="558" width="10" height="198" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2" />
