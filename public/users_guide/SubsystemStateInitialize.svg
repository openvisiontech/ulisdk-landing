  </g>
  <g>
    <text x="585.0" y="204" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Subsystem Broadcast</text>
    <rect x="531.0" y="209" width="108" height="18" rx="9" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" />
    <text x="585.0" y="222" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#92400e" text-anchor="middle">(Reset)</text>
    <line x1="495.0" y1="234" x2="863.0" y2="234" stroke="#d97706" stroke-width="2.2" marker-end="url(#arrow-broadcast)" />
    <circle cx="495.0" cy="234" r="3.5" fill="#d97706" />
  </g>
  <g>
    <rect x="437.0" y="264" width="106" height="20" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2" />
    <text x="490.0" y="278" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#92400e" text-anchor="middle">INITIALIZING</text>
    <rect x="824.0" y="264" width="92" height="20" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2" />
    <text x="870.0" y="278" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#92400e" text-anchor="middle">INITIALIZE</text>
  </g>
  <g>
    <text x="585.0" y="306" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Query Subsystem Management States</text>
    <line x1="495.0" y1="316" x2="673.0" y2="316" stroke="#1e3a8a" stroke-width="2.2" marker-end="url(#arrow-primary)" />
    <circle cx="495.0" cy="316" r="3.5" fill="#1e3a8a" />
  </g>
  <g>
    <text x="585.0" y="354" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Report Subsystem Management States</text>
    <line x1="675.0" y1="364" x2="497.0" y2="364" stroke="#d97706" stroke-width="2.2" marker-end="url(#arrow-broadcast)" />
    <circle cx="675.0" cy="364" r="3.5" fill="#d97706" />
  </g>
  <g>
    <rect x="401.5" y="392" width="177" height="42" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" />
    <text x="490.0" y="408" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#334155" text-anchor="middle">Check all management</text>
    <text x="490.0" y="422" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#334155" text-anchor="middle">states are in INITIALIZE</text>
  </g>
  <g>
    <rect x="444.0" y="448" width="92" height="20" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2" />
    <text x="490.0" y="462" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#92400e" text-anchor="middle">INITIALIZE</text>
  </g>
  <g>
    <text x="585.0" y="538" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Subsystem Broadcast</text>
    <rect x="531.0" y="543" width="108" height="18" rx="9" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" />
    <text x="585.0" y="556" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#92400e" text-anchor="middle">(Start)</text>
    <line x1="495.0" y1="568" x2="863.0" y2="568" stroke="#d97706" stroke-width="2.2" marker-end="url(#arrow-broadcast)" />
    <circle cx="495.0" cy="568" r="3.5" fill="#d97706" />
  </g>
  <g>
    <rect x="408.0" y="596" width="164" height="42" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" />
    <text x="490.0" y="612" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#334155" text-anchor="middle">Check all management</text>
    <text x="490.0" y="626" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#334155" text-anchor="middle">states are in STAND_BY</text>
    <rect x="824.0" y="607" width="92" height="20" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2" />
    <text x="870.0" y="621" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#334155" text-anchor="middle">STAND_BY</text>
  </g>
  <g>
    <rect x="440.5" y="652" width="99" height="20" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="1.2" />
    <text x="490.0" y="666" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#166534" text-anchor="middle">OPERATIONAL</text>
  </g>
  <g>
    <text x="395.0" y="694" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Go</text>
    <line x1="305.0" y1="704" x2="863.0" y2="704" stroke="#1e3a8a" stroke-width="2.2" marker-end="url(#arrow-primary)" />
    <circle cx="305.0" cy="704" r="3.5" fill="#1e3a8a" />
  </g>
  <g>
    <rect x="824.0" y="734" width="92" height="20" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="1.2" />
    <text x="870.0" y="748" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#166534" text-anchor="middle">READY</text>
  </g>
