    <rect x="27.0" y="30" width="166" height="64" rx="9" fill="url(#orange-frame)" stroke="#b45309" stroke-width="1.2" />
    <rect x="35.0" y="37" width="150" height="50" rx="5" fill="url(#blue-panel)" stroke="#475569" stroke-width="1" />
    <text x="110.0" y="58" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a" text-anchor="middle">OCU (Subsystem</text>
    <text x="110.0" y="75" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a" text-anchor="middle">State Client)</text>
  </g>
  <g>
    <rect x="219.0" y="33" width="166" height="64" rx="9" fill="#0f172a" fill-opacity="0.12" />
    <rect x="217.0" y="30" width="166" height="64" rx="9" fill="url(#orange-frame)" stroke="#b45309" stroke-width="1.2" />
    <rect x="225.0" y="37" width="150" height="50" rx="5" fill="url(#blue-panel)" stroke="#475569" stroke-width="1" />
    <text x="300.0" y="58" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a" text-anchor="middle">OCU (Management</text>
    <text x="300.0" y="75" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Client)</text>
  </g>
  <g>
    <rect x="409.0" y="33" width="166" height="64" rx="9" fill="#0f172a" fill-opacity="0.12" />
    <rect x="407.0" y="30" width="166" height="64" rx="9" fill="url(#orange-frame)" stroke="#b45309" stroke-width="1.2" />
    <rect x="415.0" y="37" width="150" height="50" rx="5" fill="url(#blue-panel)" stroke="#475569" stroke-width="1" />
