  <g fill="#64748b">
    <rect x="94.0" y="786" width="32" height="5" rx="2.5" />
    <rect x="284.0" y="786" width="32" height="5" rx="2.5" />
    <rect x="474.0" y="786" width="32" height="5" rx="2.5" />
    <rect x="664.0" y="786" width="32" height="5" rx="2.5" />
    <rect x="854.0" y="786" width="32" height="5" rx="2.5" />
  </g>
