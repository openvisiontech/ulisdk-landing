      <stop offset="0%" stop-color="#a8d595" />
      <stop offset="100%" stop-color="#84b86e" />
    </linearGradient>

    <!-- Transition number badge gradient -->
    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>

    <!-- Arrowhead marker -->
