    <!-- Subsystem label badge gradient -->
    <linearGradient id="subsystem-badge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
