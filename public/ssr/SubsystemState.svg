<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg version="1.1" viewBox="0 0 460 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Outer canvas background gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#eef2f6" />
    </linearGradient>

    <!-- Orange outer capsule gradient -->
    <linearGradient id="orange-frame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb03a" />
      <stop offset="50%" stop-color="#ff9900" />
      <stop offset="100%" stop-color="#e08200" />
    </linearGradient>

    <!-- Green inner capsule gradient -->
    <linearGradient id="node-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a8d595" />
      <stop offset="100%" stop-color="#84b86e" />
    </linearGradient>

    <!-- Transition number badge gradient -->
    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>

    <!-- Arrowhead marker -->
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0.5 L 9.5 4 L 0 7.5 L 1.8 4 Z" fill="#1e293b" />
    </marker>
  </defs>
  <rect x="8" y="8" width="444" height="544" rx="14" fill="url(#bg-grad)" stroke="#cbd5e1" stroke-width="1.5" />
  <!-- Transitions -->
  <line x1="196" y1="106" x2="196" y2="174" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arrow)" />
  <line x1="232" y1="238" x2="232" y2="310" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arrow)" />
  <g>
    <circle cx="255.5" cy="275.5" r="13" fill="#0f172a" fill-opacity="0.12" />
    <circle cx="254" cy="274.0" r="13" fill="url(#badge-grad)" stroke="#1e3a8a" stroke-width="1.2" />
    <text x="254" y="278.5" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">1</text>
  </g>
  <line x1="160" y1="310" x2="160" y2="238" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arrow)" />
  <g>
    <circle cx="183.5" cy="275.5" r="13" fill="#0f172a" fill-opacity="0.12" />
    <circle cx="182" cy="274.0" r="13" fill="url(#badge-grad)" stroke="#1e3a8a" stroke-width="1.2" />
    <text x="182" y="278.5" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">2</text>
  </g>
  <line x1="196" y1="374" x2="196" y2="446" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arrow)" />
  <g>
    <circle cx="219.5" cy="411.5" r="13" fill="#0f172a" fill-opacity="0.12" />
    <circle cx="218" cy="410.0" r="13" fill="url(#badge-grad)" stroke="#1e3a8a" stroke-width="1.2" />
    <text x="218" y="414.5" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">3</text>
  </g>
  <path d="M 299 478 L 366 478 Q 374 478 374 470 L 374 214 Q 374 206 366 206 L 299 206" fill="none" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arrow)" />
  <g>
    <circle cx="399.5" cy="343.5" r="13" fill="#0f172a" fill-opacity="0.12" />
    <circle cx="398" cy="342" r="13" fill="url(#badge-grad)" stroke="#1e3a8a" stroke-width="1.2" />
    <text x="398" y="346.5" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">4</text>
  </g>
  <!-- Start Node S -->
  <g>
    <circle cx="199" cy="71" r="38" fill="#0f172a" fill-opacity="0.14" />
    <circle cx="196" cy="68" r="38" fill="url(#orange-frame)" stroke="#78350f" stroke-width="1.4" />
    <circle cx="196" cy="68" r="28" fill="url(#node-green)" stroke="#1e293b" stroke-width="1.2" />
    <text x="196" y="75" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#0f172a" text-anchor="middle">S</text>
  </g>
  <g>
    <rect x="96.0" y="177.0" width="206" height="64" rx="32.0" fill="#0f172a" fill-opacity="0.14" />
    <rect x="93.0" y="174.0" width="206" height="64" rx="32.0" fill="url(#orange-frame)" stroke="#78350f" stroke-width="1.4" />
    <rect x="102.0" y="181.0" width="188" height="50" rx="25.0" fill="url(#node-green)" stroke="#1e293b" stroke-width="1.2" />
    <text x="196" y="212" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">INITIALIZE</text>
  </g>
  <g>
    <rect x="96.0" y="313.0" width="206" height="64" rx="32.0" fill="#0f172a" fill-opacity="0.14" />
    <rect x="93.0" y="310.0" width="206" height="64" rx="32.0" fill="url(#orange-frame)" stroke="#78350f" stroke-width="1.4" />
    <rect x="102.0" y="317.0" width="188" height="50" rx="25.0" fill="url(#node-green)" stroke="#1e293b" stroke-width="1.2" />
    <text x="196" y="348" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">OPERATIONAL</text>
  </g>
  <g>
    <rect x="96.0" y="449.0" width="206" height="64" rx="32.0" fill="#0f172a" fill-opacity="0.14" />
    <rect x="93.0" y="446.0" width="206" height="64" rx="32.0" fill="url(#orange-frame)" stroke="#78350f" stroke-width="1.4" />
    <rect x="102.0" y="453.0" width="188" height="50" rx="25.0" fill="url(#node-green)" stroke="#1e293b" stroke-width="1.2" />
    <text x="196" y="484" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">EMERGENCY</text>
  </g>
</svg>
