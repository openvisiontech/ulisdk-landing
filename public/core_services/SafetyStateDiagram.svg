<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg version="1.1" viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Initial State Indicator -->
  <circle cx="130" cy="80" r="12" fill="#000000" />
  <path d="M 130 92 L 130 140" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Transitions -->
  <!-- E: DEFAULT -> FAULT -->
  <path d="M 330 140 L 330 80" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="350" y="115" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">E</text>

  <!-- A: PAIRING -> OPERATIONAL -->
  <path d="M 110 180 L 110 240" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="90" y="215" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">A</text>

  <!-- B: OPERATIONAL -> PAIRING -->
  <path d="M 150 240 L 150 180" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="170" y="225" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">B</text>

  <!-- C: OPERATIONAL -> EMERGENCY -->
  <path d="M 200 250 L 260 250" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="230" y="240" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">C</text>

  <!-- D: EMERGENCY -> OPERATIONAL -->
  <path d="M 260 270 L 200 270" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="230" y="290" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">D</text>

  <!-- Nodes -->
  <!-- FAULT -->
  <rect x="260" y="40" width="140" height="40" rx="20" fill="#ff9900" stroke="#000000" stroke-width="1" />
  <rect x="264" y="43" width="132" height="34" rx="17" fill="#93c47d" stroke="#000000" stroke-width="1" />
  <text x="330" y="64" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">FAULT</text>

  <!-- DEFAULT -->
  <rect x="260" y="140" width="140" height="40" rx="20" fill="#ff9900" stroke="#000000" stroke-width="1" />
  <rect x="264" y="143" width="132" height="34" rx="17" fill="#93c47d" stroke="#000000" stroke-width="1" />
  <text x="330" y="164" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">DEFAULT</text>

  <!-- PAIRING -->
  <rect x="60" y="140" width="140" height="40" rx="20" fill="#ff9900" stroke="#000000" stroke-width="1" />
  <rect x="64" y="143" width="132" height="34" rx="17" fill="#93c47d" stroke="#000000" stroke-width="1" />
  <text x="130" y="164" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">PAIRING</text>

  <!-- OPERATIONAL -->
  <rect x="60" y="240" width="140" height="40" rx="20" fill="#ff9900" stroke="#000000" stroke-width="1" />
  <rect x="64" y="243" width="132" height="34" rx="17" fill="#93c47d" stroke="#000000" stroke-width="1" />
  <text x="130" y="264" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">OPERATIONAL</text>

  <!-- EMERGENCY -->
  <rect x="260" y="240" width="140" height="40" rx="20" fill="#ff9900" stroke="#000000" stroke-width="1" />
  <rect x="264" y="243" width="132" height="34" rx="17" fill="#93c47d" stroke="#000000" stroke-width="1" />
  <text x="330" y="264" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">EMERGENCY</text>

</svg>
