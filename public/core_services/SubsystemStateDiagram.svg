<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg version="1.1" viewBox="0 0 650 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Initial State Indicator -->
  <circle cx="130" cy="160" r="12" fill="#000000" />
  <path d="M 130 172 L 130 220" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Transitions -->
  <!-- I: DEFAULT -> SHUTDOWN -->
  <path d="M 330 120 L 330 80" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="315" y="105" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">I</text>

  <!-- J: DEFAULT -> RENDER USELESS -->
  <path d="M 400 140 L 460 140" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="430" y="130" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">J</text>

  <!-- A: INITIALIZING -> INITIALIZE -->
  <path d="M 130 260 L 130 320" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="115" y="295" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">A</text>

  <!-- B: INITIALIZE -> OPERATIONAL -->
  <path d="M 200 340 L 260 340" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="230" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">B</text>

  <!-- C: OPERATIONAL -> INITIALIZING -->
  <path d="M 330 320 L 330 240 L 200 240" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="265" y="230" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">C</text>

  <!-- D: INITIALIZE (self loop) -->
  <path d="M 100 360 L 100 400 L 160 400 L 160 360" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="130" y="420" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">D</text>

  <!-- E: OPERATIONAL -> EMERGENCY -->
  <path d="M 330 360 L 330 420" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="315" y="395" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">E</text>

  <!-- F: EMERGENCY -> INITIALIZING -->
  <path d="M 260 440 L 40 440 L 40 240 L 60 240" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="150" y="460" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">F</text>

  <!-- G: OPERATIONAL -> PAUSE -->
  <path d="M 400 350 L 460 350" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="430" y="370" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">G</text>

  <!-- H: PAUSE -> OPERATIONAL -->
  <path d="M 460 330 L 400 330" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="430" y="320" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">H</text>

  <!-- Nodes -->
  <!-- SHUTDOWN -->
  <rect x="260" y="40" width="140" height="40" rx="20" fill="#ff9900" stroke="#000000" stroke-width="1" />
  <rect x="264" y="43" width="132" height="34" rx="17" fill="#93c47d" stroke="#000000" stroke-width="1" />
  <text x="330" y="64" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">SHUTDOWN</text>

  <!-- DEFAULT -->
  <rect x="260" y="120" width="140" height="40" rx="20" fill="#ff9900" stroke="#000000" stroke-width="1" />
  <rect x="264" y="123" width="132" height="34" rx="17" fill="#93c47d" stroke="#000000" stroke-width="1" />
  <text x="330" y="144" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">DEFAULT</text>

  <!-- RENDER USELESS -->
  <rect x="460" y="120" width="140" height="40" rx="20" fill="#ff9900" stroke="#000000" stroke-width="1" />
  <rect x="464" y="123" width="132" height="34" rx="17" fill="#93c47d" stroke="#000000" stroke-width="1" />
  <text x="530" y="138" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">
    <tspan x="530" dy="0">RENDER</tspan>
    <tspan x="530" dy="12">USELESS</tspan>
  </text>

  <!-- INITIALIZING -->
  <rect x="60" y="220" width="140" height="40" rx="20" fill="#ff9900" stroke="#000000" stroke-width="1" />
  <rect x="64" y="223" width="132" height="34" rx="17" fill="#93c47d" stroke="#000000" stroke-width="1" />
  <text x="130" y="244" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">INITIALIZING</text>

  <!-- INITIALIZE -->
  <rect x="60" y="320" width="140" height="40" rx="20" fill="#ff9900" stroke="#000000" stroke-width="1" />
  <rect x="64" y="323" width="132" height="34" rx="17" fill="#93c47d" stroke="#000000" stroke-width="1" />
  <text x="130" y="344" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">INITIALIZE</text>

  <!-- OPERATIONAL -->
  <rect x="260" y="320" width="140" height="40" rx="20" fill="#ff9900" stroke="#000000" stroke-width="1" />
  <rect x="264" y="323" width="132" height="34" rx="17" fill="#93c47d" stroke="#000000" stroke-width="1" />
  <text x="330" y="344" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">OPERATIONAL</text>

  <!-- PAUSE -->
  <rect x="460" y="320" width="140" height="40" rx="20" fill="#ff9900" stroke="#000000" stroke-width="1" />
  <rect x="464" y="323" width="132" height="34" rx="17" fill="#93c47d" stroke="#000000" stroke-width="1" />
  <text x="530" y="344" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">PAUSE</text>

  <!-- EMERGENCY -->
  <rect x="260" y="420" width="140" height="40" rx="20" fill="#ff9900" stroke="#000000" stroke-width="1" />
  <rect x="264" y="423" width="132" height="34" rx="17" fill="#93c47d" stroke="#000000" stroke-width="1" />
  <text x="330" y="444" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">EMERGENCY</text>

</svg>
