<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg version="1.1" viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Initial State -->
  <circle cx="120" cy="220" r="12" fill="#000000" />
  <path d="M 120 232 L 120 280" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Transitions -->
  <!-- L: DEFAULT -> FATAL -->
  <path d="M 320 160 L 320 100" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="305" y="135" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">L</text>

  <!-- M: DEFAULT -> SHUTDOWN -->
  <path d="M 400 180 L 440 180" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="420" y="175" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">M</text>

  <!-- N: DEFAULT -> RENDER USELESS -->
  <path d="M 240 180 L 200 180" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="220" y="175" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">N</text>

  <!-- A: INITIALIZE -> STAND BY -->
  <path d="M 200 290 L 240 290" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="220" y="285" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">A</text>

  <!-- B: STAND BY -> INITIALIZE -->
  <path d="M 240 310 L 200 310" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="220" y="325" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">B</text>

  <!-- C: STAND BY -> READY -->
  <path d="M 310 320 L 310 400" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="295" y="365" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">C</text>

  <!-- D: READY -> STAND BY -->
  <path d="M 330 400 L 330 320" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="345" y="365" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">D</text>

  <!-- E: STAND BY -> EMERGENCY -->
  <path d="M 400 300 L 520 300 L 520 400" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="460" y="290" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">E</text>

  <!-- F: READY -> EMERGENCY -->
  <path d="M 400 420 L 440 420" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="420" y="415" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">F</text>

  <!-- G: EMERGENCY -> INITIALIZE -->
  <path d="M 520 440 L 520 590 L 20 590 L 20 300 L 40 300" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="270" y="580" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">G</text>

  <!-- H: READY -> INITIALIZE -->
  <path d="M 240 420 L 120 420 L 120 320" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="180" y="410" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">H</text>

  <!-- I: READY -> PAUSE -->
  <path d="M 320 440 L 320 520" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="305" y="485" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">I</text>

  <!-- J: PAUSE -> CONTINUE -->
  <path d="M 400 540 L 440 540" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="420" y="535" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">J</text>

  <!-- K: CONTINUE -> STAND BY -->
  <path d="M 600 540 L 630 540 L 630 250 L 360 250 L 360 280" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="645" y="400" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">K</text>


  <!-- Nodes -->
  <!-- FAULT -->
  <rect x="240" y="60" width="160" height="40" rx="20" fill="#ff9900" stroke="#000000" stroke-width="1" />
  <rect x="244" y="63" width="152" height="34" rx="17" fill="#93c47d" stroke="#000000" stroke-width="1" />
  <text x="320" y="84" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">FAULT</text>

  <!-- RENDER USELESS -->
  <rect x="40" y="160" width="160" height="40" rx="20" fill="#ff9900" stroke="#000000" stroke-width="1" />
  <rect x="44" y="163" width="152" height="34" rx="17" fill="#93c47d" stroke="#000000" stroke-width="1" />
  <text x="120" y="178" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">
    <tspan x="120" dy="0">RENDER</tspan>
    <tspan x="120" dy="12">USELESS</tspan>
  </text>

  <!-- DEFAULT -->
  <rect x="240" y="160" width="160" height="40" rx="20" fill="#ff9900" stroke="#000000" stroke-width="1" />
  <rect x="244" y="163" width="152" height="34" rx="17" fill="#93c47d" stroke="#000000" stroke-width="1" />
  <text x="320" y="184" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">DEFAULT</text>

  <!-- SHUTDOWN -->
  <rect x="440" y="160" width="160" height="40" rx="20" fill="#ff9900" stroke="#000000" stroke-width="1" />
  <rect x="444" y="163" width="152" height="34" rx="17" fill="#93c47d" stroke="#000000" stroke-width="1" />
  <text x="520" y="184" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">SHUTDOWN</text>

  <!-- INITIALIZE -->
  <rect x="40" y="280" width="160" height="40" rx="20" fill="#ff9900" stroke="#000000" stroke-width="1" />
  <rect x="44" y="283" width="152" height="34" rx="17" fill="#93c47d" stroke="#000000" stroke-width="1" />
  <text x="120" y="304" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">INITIALIZE</text>

  <!-- STAND_BY -->
  <rect x="240" y="280" width="160" height="40" rx="20" fill="#ff9900" stroke="#000000" stroke-width="1" />
  <rect x="244" y="283" width="152" height="34" rx="17" fill="#93c47d" stroke="#000000" stroke-width="1" />
  <text x="320" y="304" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">STAND_BY</text>

  <!-- READY -->
  <rect x="240" y="400" width="160" height="40" rx="20" fill="#ff9900" stroke="#000000" stroke-width="1" />
  <rect x="244" y="403" width="152" height="34" rx="17" fill="#93c47d" stroke="#000000" stroke-width="1" />
  <text x="320" y="424" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">READY</text>

  <!-- EMERGENCY -->
  <rect x="440" y="400" width="160" height="40" rx="20" fill="#ff9900" stroke="#000000" stroke-width="1" />
  <rect x="444" y="403" width="152" height="34" rx="17" fill="#93c47d" stroke="#000000" stroke-width="1" />
  <text x="520" y="424" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">EMERGENCY</text>

  <!-- PAUSE -->
  <rect x="240" y="520" width="160" height="40" rx="20" fill="#ff9900" stroke="#000000" stroke-width="1" />
  <rect x="244" y="523" width="152" height="34" rx="17" fill="#93c47d" stroke="#000000" stroke-width="1" />
  <text x="320" y="544" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">PAUSE</text>

  <!-- CONTINUE -->
  <rect x="440" y="520" width="160" height="40" rx="20" fill="#ff9900" stroke="#000000" stroke-width="1" />
  <rect x="444" y="523" width="152" height="34" rx="17" fill="#93c47d" stroke="#000000" stroke-width="1" />
  <text x="520" y="544" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">CONTINUE</text>

</svg>
