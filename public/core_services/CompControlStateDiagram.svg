<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg version="1.1" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Transitions -->
  <!-- Initial State Indicator -->
  <circle cx="180" cy="120" r="12" fill="#000000" />
  <path d="M 180 132 L 180 200" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- G: DEFAULT -> NOT AVAIL NO CONTROL -->
  <path d="M 430 140 L 430 200" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="445" y="175" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">G</text>

  <!-- A: AVAIL NO CONTROL -> AVAIL UNDER CONTROL -->
  <path d="M 210 240 L 210 300" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="225" y="275" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">A</text>

  <!-- B: AVAIL UNDER CONTROL -> AVAIL NO CONTROL -->
  <path d="M 150 300 L 150 240" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="135" y="275" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">B</text>

  <!-- C: AVAIL NO CONTROL -> NOT AVAIL NO CONTROL -->
  <path d="M 260 210 L 350 210" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="305" y="200" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">C</text>

  <!-- D: NOT AVAIL NO CONTROL -> AVAIL NO CONTROL -->
  <path d="M 350 230 L 260 230" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="305" y="245" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">D</text>

  <!-- E: AVAIL UNDER CONTROL -> NOT AVAIL UNDER CONTROL -->
  <path d="M 260 310 L 350 310" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="305" y="300" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">E</text>

  <!-- F: NOT AVAIL UNDER CONTROL -> AVAIL UNDER CONTROL -->
  <path d="M 350 330 L 260 330" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="305" y="345" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">F</text>

  <!-- Nodes -->
  <!-- Node 1: DEFAULT -->
  <rect x="350" y="100" width="160" height="40" rx="20" fill="#ff9900" stroke="#000000" stroke-width="1" />
  <rect x="354" y="103" width="152" height="34" rx="17" fill="#93c47d" stroke="#000000" stroke-width="1" />
  <text x="430" y="124" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">DEFAULT</text>

  <!-- Node 2: AVAIL NO CONTROL -->
  <rect x="100" y="200" width="160" height="40" rx="20" fill="#ff9900" stroke="#000000" stroke-width="1" />
  <rect x="104" y="203" width="152" height="34" rx="17" fill="#93c47d" stroke="#000000" stroke-width="1" />
  <text x="180" y="217" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">
    <tspan x="180" dy="0">AVAIL NO</tspan>
    <tspan x="180" dy="12">CONTROL</tspan>
  </text>

  <!-- Node 3: NOT AVAIL NO CONTROL -->
  <rect x="350" y="200" width="160" height="40" rx="20" fill="#ff9900" stroke="#000000" stroke-width="1" />
  <rect x="354" y="203" width="152" height="34" rx="17" fill="#93c47d" stroke="#000000" stroke-width="1" />
  <text x="430" y="217" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">
    <tspan x="430" dy="0">NOT AVAIL</tspan>
    <tspan x="430" dy="12">NO CONTROL</tspan>
  </text>

  <!-- Node 4: AVAIL UNDER CONTROL -->
  <rect x="100" y="300" width="160" height="40" rx="20" fill="#ff9900" stroke="#000000" stroke-width="1" />
  <rect x="104" y="303" width="152" height="34" rx="17" fill="#93c47d" stroke="#000000" stroke-width="1" />
  <text x="180" y="317" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">
    <tspan x="180" dy="0">AVAIL UNDER</tspan>
    <tspan x="180" dy="12">CONTROL</tspan>
  </text>

  <!-- Node 5: NOT AVAIL UNDER CONTROL -->
  <rect x="350" y="300" width="160" height="40" rx="20" fill="#ff9900" stroke="#000000" stroke-width="1" />
  <rect x="354" y="303" width="152" height="34" rx="17" fill="#93c47d" stroke="#000000" stroke-width="1" />
  <text x="430" y="317" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">
    <tspan x="430" dy="0">NOT AVAIL</tspan>
    <tspan x="430" dy="12">UNDER CONTROL</tspan>
  </text>

</svg>
